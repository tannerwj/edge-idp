[extend]
useDefault = true

[[allowlists]]
description = "redacted placeholder values are not secrets"
regexes = ["<redacted>"]

[[allowlists]]
description = "wrangler dev/build output is gitignored and regenerated"
paths = ["\\.wrangler/.*"]

[[allowlists]]
description = "passkey provider AAGUIDs are public authenticator model ids, not secrets"
condition = "AND"
paths = ["src/aaguid\\.ts"]
regexes = ['''[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''']

[[allowlists]]
description = "cf build output/types are gitignored and regenerated"
paths = ["\\.cloudflare/.*"]
